<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b1a1f" />
    <meta
      name="description"
      content="Step-by-step support guides for the Electronic Patient Record system."
    />
    <title>EPIC EPR Support Guide</title>
    <!--
      Runs before the first paint so the page never flashes the wrong theme.
      Inline and blocking on purpose: deferring it to the React bundle would
      paint light, then repaint dark. Dark is the default — a stored choice is
      the only thing that overrides it, and a private-mode localStorage throw
      must not take the page down with it.
    -->
    <script>
      try {
        var stored = localStorage.getItem('epr-theme')
        document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark'
      } catch (_) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font: 1rem/1.6 system-ui, sans-serif; color: #27505b">
        This wiki needs JavaScript switched on to display guides. The guides themselves are plain
        text files in the <code>content</code> folder of this site if you need to read one directly.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
