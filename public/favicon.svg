<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img"
     aria-label="EPIC EPR Support Guide">
  <!--
    The hero mark from the home page, redrawn for a favicon canvas: white rounded
    tile, ring in teal-mid (#90c3cb), Phosphor duotone Asclepius in teal-deep
    (#2a666f). Corner radius is 30% of the tile, matching rounded-3xl at the
    hero's size.

    The ring is proportionally thicker and the icon proportionally larger than in
    the hero, because a favicon is rendered at 16px with no surrounding context —
    at the hero's exact ratios both vanish at that size.

    Path data is taken verbatim from @phosphor-icons/react (Asclepius, duotone),
    which is the same source the hero renders, so the two cannot drift in shape.
  -->
  <rect x="8" y="8" width="240" height="240" rx="72" fill="#ffffff" stroke="#90c3cb"
        stroke-width="10" />
  <g transform="translate(28 28) scale(0.78)" fill="#2a666f">
    <path d="M88,48v8A32,32,0,0,1,56,88H32V80A32,32,0,0,1,64,48Z" opacity="0.2" />
    <path d="M216,79v1a40,40,0,0,1-40,40H136v80h8a16,16,0,0,0,10.67-27.93,8,8,0,0,1,10.66-11.92A32,32,0,0,1,144,216h-8v16a8,8,0,0,1-16,0V216H96a8,8,0,0,1,0-16h24V120H96a16,16,0,0,0,0,32,8,8,0,0,1,0,16,32,32,0,0,1,0-64h24V24a8,8,0,0,1,16,0v80h40a24,24,0,0,0,24-24V79a23,23,0,0,0-23-23H160a8,8,0,0,1,0-16h17a39,39,0,0,1,39,39ZM56,96H32a8,8,0,0,1-8-8V80A40,40,0,0,1,64,40H96a8,8,0,0,1,0,16A40,40,0,0,1,56,96ZM80,56H64A24,24,0,0,0,40,80H56A24,24,0,0,0,80,56Z" />
  </g>
</svg>
